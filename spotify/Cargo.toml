[package]
name = "szklo-spotify"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Spotify w Szkle: biblioteka (playlisty, polubione, albumy, wykonawcy) i wyszukiwanie – wspólne dla PC i Androida"

[dependencies]
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
librespot-protocol = "0.8"
protobuf = "3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
http = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
